[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundboard-lab"
version = "0.0.1"
description = "Engine for soundboard eigenmode FEA experiments (pure Python, no bpy)"
requires-python = ">=3.11"
dependencies = ["gmsh", "meshio", "numpy", "trimesh", "pymeshfix", "scipy", "networkx", "rtree"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
